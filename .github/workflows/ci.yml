name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # CI 每次都是全新构建，增量编译的缓存只占空间。
  CARGO_INCREMENTAL: 0

jobs:
  # 格式、clippy、全部测试（含 GPUI 界面），在 Linux 上跑。
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: 系统依赖（GPUI、托盘图标、系统通知）
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxdo-dev libayatana-appindicator3-dev libvulkan-dev libfontconfig1-dev libssl-dev \
            libdbus-1-dev libx11-xcb-dev libxcb1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # Windows 是主要平台，macOS 有 Seatbelt 沙箱：非界面部分（默认成员）在两边各跑一遍测试。
  # 界面 crate 也编译一遍，确认平台相关的代码能过。
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo check -p dshr-desktop --locked

  # 依赖的许可证、安全公告、来源（见 deny.toml）。
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
