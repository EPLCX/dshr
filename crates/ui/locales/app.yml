  accessibility_desc:
    zh-CN: "让界面更容易看清、更容易用键盘和读屏软件操作。"
    en: "Make the interface easier to see and easier to use with a keyboard or screen reader."
    zh-HK: "令介面易睇啲，方便用鍵盤同讀屏軟件。"
    zh-TW: "讓介面更容易看清，更方便以鍵盤和螢幕閱讀器操作。"
    de: "Die Oberfläche besser lesbar und mit Tastatur oder Screenreader leichter bedienbar machen."
    el: "Κάντε τη διεπαφή πιο ευανάγνωστη και πιο εύχρηστη με πληκτρολόγιο ή αναγνώστη οθόνης."
    ja: "画面を見やすくし、キーボードやスクリーンリーダーで操作しやすくします。"
    es: "Haz que la interfaz se vea mejor y sea más fácil de usar con teclado o lector de pantalla."
    fr: "Rendez l’interface plus lisible et plus facile à utiliser au clavier ou avec un lecteur d’écran."
    pt: "Deixe a interface mais fácil de ver e de usar com teclado ou leitor de tela."
