    de: "Zeigt um das fokussierte Steuerelement einen dickeren, doppelten Rahmen – auch nach einem Mausklick."
    el: "Εμφανίζει παχύτερο, διπλό περίγραμμα γύρω από το εστιασμένο στοιχείο, και μετά από κλικ."
    ja: "フォーカスのあるコントロールを太い二重の枠で囲みます。マウスでクリックしたときも表示します。"
    es: "Muestra un contorno doble y más grueso alrededor del control con el foco, también al hacer clic."
    fr: "Affiche un double contour plus épais autour du contrôle actif, y compris après un clic."
    pt: "Mostra um contorno duplo e mais grosso ao redor do controle em foco, inclusive após um clique."
