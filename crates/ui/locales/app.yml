      es: "Cuando el uso estimado de la ventana de contexto alcanza esta proporción, se resumen los turnos anteriores."
      fr: "Lorsque l’utilisation estimée de la fenêtre de contexte atteint cette proportion, les échanges précédents sont résumés."
      pt: "Quando o uso estimado da janela de contexto atinge essa proporção, os turnos anteriores da conversa são resumidos."

