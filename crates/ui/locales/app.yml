    zh-HK: "有腳本：會喺外掛執行環境（QuickJS）行 JavaScript，淨係用得佢聲明兼經你批准嘅能力。"
    zh-TW: "帶有腳本：會在外掛執行環境（QuickJS）中執行 JavaScript，只能做它宣告並經你允許的事。"
    de: "Enthält ein Skript: führt JavaScript in der Plugin-Laufzeit (QuickJS) aus, beschränkt auf das, was es anfordert und du erlaubst."
    el: "Περιέχει σενάριο: εκτελεί JavaScript στο περιβάλλον των plugin (QuickJS), μόνο όσα δηλώνει και εγκρίνετε."
    ja: "スクリプトを含みます：プラグインランタイム（QuickJS）で JavaScript を実行し、宣言してあなたが許可したことだけを行えます。"
    es: "Incluye un script: ejecuta JavaScript en el entorno de plugins (QuickJS), limitado a lo que declara y tú permites."
    fr: "Contient un script : exécute du JavaScript dans l’environnement des plugins (QuickJS), limité à ce qu’il déclare et que vous autorisez."
    pt: "Inclui um script: executa JavaScript no ambiente de plugins (QuickJS), limitado ao que ele declara e você permite."
