notice:
  compacted:
    zh-CN: "对话较长，较早的内容已压缩为摘要，后续请求仅包含摘要"
    en: "The conversation is long; earlier turns were compacted into a summary"
    zh-HK: "對話太長，早期嘅回合已經壓縮成摘要"
    zh-TW: "對話較長，較早的回合已壓縮為摘要"
    de: "Die Unterhaltung ist lang geworden, daher wurden frühere Schritte zu einer Zusammenfassung verdichtet"
    el: "Η συνομιλία έγινε μεγάλη, γι' αυτό οι προηγούμενοι γύροι συμπτύχθηκαν σε περίληψη"
    ja: "会話が長くなったため、以前のターンは要約にまとめられました"
