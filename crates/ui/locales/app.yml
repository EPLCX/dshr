  unsigned:
    zh-CN: "没有签名：无法确认发布者，也无法确认内容没有被改过。"
    en: "Not signed: the publisher and the contents cannot be verified."
    zh-HK: "未簽名：確認唔到發佈者，亦確認唔到內容有冇被人改過。"
    zh-TW: "沒有簽章：無法確認發佈者，也無法確認內容沒有被竄改。"
    de: "Nicht signiert: Herausgeber und Inhalt lassen sich nicht überprüfen."
    el: "Χωρίς υπογραφή: ο εκδότης και το περιεχόμενο δεν μπορούν να επαληθευτούν."
    ja: "署名なし：発行元も内容が改ざんされていないことも確認できません。"
    es: "Sin firma: no se pueden verificar ni el editor ni el contenido."
    fr: "Non signé : ni l’éditeur ni le contenu ne peuvent être vérifiés."
    pt: "Sem assinatura: não é possível verificar o editor nem o conteúdo."
  signed_by:
    zh-CN: "已签名，签名有效（发布者 %{key}，首次安装，之后的更新须由同一发布者签名）"
    en: "Signed with a valid signature (publisher %{key}; first install — later updates must come from the same publisher)"
    zh-HK: "簽咗名，簽名有效（發佈者 %{key}，第一次安裝；之後嘅更新要由同一個發佈者簽名）"
    zh-TW: "已簽章，簽章有效（發佈者 %{key}，首次安裝；之後的更新須由同一發佈者簽章）"
    de: "Mit gültiger Signatur (Herausgeber %{key}; Erstinstallation – spätere Updates müssen vom selben Herausgeber stammen)"
    el: "Με έγκυρη υπογραφή (εκδότης %{key}· πρώτη εγκατάσταση — οι επόμενες ενημερώσεις πρέπει να προέρχονται από τον ίδιο εκδότη)"
    ja: "有効な署名あり（発行元 %{key}、初回インストール。今後の更新は同じ発行元の署名が必要です）"
    es: "Firmado con una firma válida (editor %{key}; primera instalación: las actualizaciones posteriores deben venir del mismo editor)"
    fr: "Signé avec une signature valide (éditeur %{key} ; première installation — les mises à jour suivantes devront venir du même éditeur)"
    pt: "Assinado com assinatura válida (editor %{key}; primeira instalação — as próximas atualizações devem vir do mesmo editor)"
  same_publisher:
    zh-CN: "已签名，与已安装版本是同一发布者（%{key}）"
    en: "Signed by the same publisher as the installed version (%{key})"
    zh-HK: "簽咗名，發佈者同已安裝版本一樣（%{key}）"
    zh-TW: "已簽章，與已安裝版本是同一發佈者（%{key}）"
    de: "Vom selben Herausgeber signiert wie die installierte Version (%{key})"
    el: "Υπογεγραμμένο από τον ίδιο εκδότη με την εγκατεστημένη έκδοση (%{key})"
    ja: "インストール済みのバージョンと同じ発行元による署名（%{key}）"
    es: "Firmado por el mismo editor que la versión instalada (%{key})"
    fr: "Signé par le même éditeur que la version installée (%{key})"
    pt: "Assinado pelo mesmo editor da versão instalada (%{key})"
  publisher_changed:
    zh-CN: "发布者已变化：之前由 %{previous} 签名，这个包由 %{now} 签名。可能是包被冒充。"
    en: "The publisher has changed: earlier versions were signed by %{previous}, this package by %{now}. It may be an impersonation."
    zh-HK: "發佈者變咗：之前嘅版本係由 %{previous} 簽名，這個安裝包就由 %{now} 簽名。發佈者可能被人冒充。"
    zh-TW: "發佈者已變更：之前由 %{previous} 簽章，這個套件由 %{now} 簽章。可能是冒充的套件。"
    de: "Der Herausgeber hat sich geändert: Frühere Versionen wurden von %{previous} signiert, dieses Paket von %{now}. Möglicherweise eine Fälschung."
    el: "Ο εκδότης άλλαξε: οι προηγούμενες εκδόσεις υπογράφηκαν από %{previous}, αυτό το πακέτο από %{now}. Μπορεί να είναι πλαστό."
    ja: "発行元が変わっています：以前は %{previous} が署名していましたが、このパッケージは %{now} の署名です。なりすましの可能性があります。"
    es: "El editor ha cambiado: las versiones anteriores las firmó %{previous} y este paquete %{now}. Podría ser una suplantación."
    fr: "L’éditeur a changé : les versions précédentes étaient signées par %{previous}, ce paquet par %{now}. Il peut s’agir d’une usurpation."
    pt: "O editor mudou: as versões anteriores foram assinadas por %{previous} e este pacote por %{now}. Pode ser uma falsificação."
  publisher_removed:
    zh-CN: "之前的版本由 %{previous} 签名，这个包没有签名。可能是包被冒充。"
    en: "Earlier versions were signed by %{previous}, but this package is not signed. It may be an impersonation."
    zh-HK: "之前嘅版本係由 %{previous} 簽名，但這個安裝包未簽名。發佈者可能被人冒充。"
    zh-TW: "之前的版本由 %{previous} 簽章，這個套件卻沒有簽章。可能是冒充的套件。"
    de: "Frühere Versionen wurden von %{previous} signiert, dieses Paket ist aber nicht signiert. Möglicherweise eine Fälschung."
    el: "Οι προηγούμενες εκδόσεις υπογράφηκαν από %{previous}, αλλά αυτό το πακέτο δεν είναι υπογεγραμμένο. Μπορεί να είναι πλαστό."
    ja: "以前のバージョンは %{previous} が署名していましたが、このパッケージには署名がありません。なりすましの可能性があります。"
    es: "Las versiones anteriores las firmó %{previous}, pero este paquete no está firmado. Podría ser una suplantación."
    fr: "Les versions précédentes étaient signées par %{previous}, mais ce paquet n’est pas signé. Il peut s’agir d’une usurpation."
    pt: "As versões anteriores foram assinadas por %{previous}, mas este pacote não tem assinatura. Pode ser uma falsificação."
  publisher_blocked:
    zh-CN: "发布者变了，插件不能替你安装。确认可信的话，请下载安装包后在“设置 → 扩展”中自己安装。"
    en: "The publisher changed, so a plugin cannot install this for you. If you trust it, download the package and install it yourself in Settings → Extensions."
    zh-HK: "發佈者變咗，外掛唔可以代你安裝。如果確認來源信得過，就下載安裝包，再喺「設定 → 擴充功能」自己裝。"
    zh-TW: "發佈者已變更，外掛不能代你安裝。確認可信的話，請下載安裝套件後在「設定 → 擴充功能」中自行安裝。"
    de: "Der Herausgeber hat sich geändert, daher kann ein Plugin dies nicht für dich installieren. Wenn du ihm vertraust, lade das Paket herunter und installiere es selbst unter Einstellungen → Erweiterungen."
    el: "Ο εκδότης άλλαξε, οπότε ένα plugin δεν μπορεί να το εγκαταστήσει για εσάς. Αν το εμπιστεύεστε, κατεβάστε το πακέτο και εγκαταστήστε το μόνοι σας από τις Ρυθμίσεις → Επεκτάσεις."
    ja: "発行元が変わったため、プラグインが代わりにインストールすることはできません。信頼できる場合は、パッケージをダウンロードして「設定 → 拡張機能」からご自身でインストールしてください。"
    es: "El editor ha cambiado, así que un plugin no puede instalarlo por ti. Si confías en él, descarga el paquete e instálalo tú en Ajustes → Extensiones."
    fr: "L’éditeur a changé : un plugin ne peut donc pas l’installer à votre place. Si vous lui faites confiance, téléchargez le paquet et installez-le vous-même dans Paramètres → Extensions."
    pt: "O editor mudou, então um plugin não pode instalar isto por você. Se confiar nele, baixe o pacote e instale-o você mesmo em Configurações → Extensões."
  replaces_version:
    zh-CN: "将替换已安装的 %{version} 版本；旧版本会归档，可以回滚。"
    en: "This replaces installed version %{version}; the old version is archived so you can roll back."
    zh-HK: "會取代已安裝嘅 %{version} 版本；舊版本會歸檔，可以回滾。"
    zh-TW: "將取代已安裝的 %{version} 版本；舊版本會封存，可以回復。"
    de: "Ersetzt die installierte Version %{version}; die alte Version wird archiviert, du kannst also zurückkehren."
    el: "Αντικαθιστά την εγκατεστημένη έκδοση %{version}· η παλιά έκδοση αρχειοθετείται ώστε να μπορείτε να επιστρέψετε."
    ja: "インストール済みのバージョン %{version} を置き換えます。古いバージョンはアーカイブされ、ロールバックできます。"
    es: "Reemplaza la versión instalada %{version}; la versión anterior se archiva para que puedas volver a ella."
    fr: "Remplace la version installée %{version} ; l’ancienne version est archivée pour que vous puissiez revenir en arrière."
    pt: "Substitui a versão instalada %{version}; a versão antiga é arquivada para que você possa voltar a ela."
