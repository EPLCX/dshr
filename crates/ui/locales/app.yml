    zh-HK: "行緊嘅對話會喺背景繼續。撳一下系統匣圖示就顯示返視窗，或者喺佢選單揀「退出」。"
    zh-TW: "執行中的工作階段會在背景繼續。點擊系統匣圖示即可叫出視窗，或從其選單選擇「結束」。"
    de: "Laufende Sitzungen laufen im Hintergrund weiter. Klicke auf das Infobereich-Symbol, um das Fenster zurückzuholen, oder wähle im Menü Beenden."
    el: "Οι ενεργές συνεδρίες συνεχίζουν στο παρασκήνιο. Κάντε κλικ στο εικονίδιο της περιοχής ειδοποιήσεων για να επαναφέρετε το παράθυρο ή επιλέξτε Έξοδος από το μενού του."
    ja: "実行中のセッションはバックグラウンドで継続します。トレイアイコンをクリックするとウィンドウが戻ります。終了はトレイのメニューから選んでください。"
