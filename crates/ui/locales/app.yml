  scripts_hint:
    zh-CN: "插件目录中的脚本插件。声明了能力的插件需经你允许后才会运行；也可以在输入框的模式菜单中选择“创造模式”，由 agent 编写插件。"
    en: Script plugins in the plugin folder. Ones that declare capabilities run only after you allow them. You can also pick Create in the composer's mode menu to have the agent write one.
    zh-HK: "外掛資料夾入面嘅腳本外掛。聲明咗功能嘅外掛要你批准咗先會行。你亦都可以喺輸入框嘅模式選單揀「建立」，叫代理幫你寫一個。"
    zh-TW: "外掛程式資料夾中的指令碼外掛程式。宣告了功能的外掛程式，需經您允許後才會執行。您也可以在輸入框的模式選單中選擇「建立」，讓代理程式為您撰寫一個。"
    de: "Skript-Plugins im Plugin-Ordner. Plugins, die Fähigkeiten deklarieren, laufen erst, nachdem du sie erlaubt hast. Du kannst auch im Modus-Menü des Eingabefelds „Erstellen“ wählen, damit der Agent eines schreibt."
    el: "Plugin σεναρίων στον φάκελο plugin. Όσα δηλώνουν δυνατότητες εκτελούνται μόνο αφού τα επιτρέψετε. Μπορείτε επίσης να επιλέξετε Δημιουργία από το μενού λειτουργίας του πεδίου σύνταξης, ώστε ο agent να γράψει ένα."
    ja: "プラグインフォルダ内のスクリプトプラグイン。機能を宣言するものは、許可された後にのみ実行されます。コンポーザーのモードメニューで「作成」を選ぶと、エージェントに作成させることもできます。"
    es: "Plugins de script en la carpeta de plugins. Los que declaran capacidades solo se ejecutan después de que los permitas. También puedes elegir Crear en el menú de modo del compositor para que el agente escriba uno."
    fr: "Plugins de script dans le dossier des plugins. Ceux qui déclarent des capacités ne s’exécutent qu’après que vous les avez autorisés. Vous pouvez aussi choisir Créer dans le menu de mode du compositeur pour que l’agent en écrive un."
    pt: "Plugins de script na pasta de plugins. Os que declaram recursos só são executados depois que você os permitir. Você também pode escolher Criar no menu de modo do campo de mensagem para que o agente escreva um."
  scripts_empty:
