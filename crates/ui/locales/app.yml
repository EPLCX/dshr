  prompt_cache_hint:
    zh-CN: "缓存写入后保留多久，每次命中重新计时。命中的输入约按一折计费；写入 5 分钟的按 1.25 倍、1 小时的按 2 倍计费。两次请求常隔 5 分钟以上（等审批、边看边改）时选 1 小时更省。"
    en: "How long a cache write is kept; every hit restarts the timer. Cached input costs about a tenth; writes cost 1.25× (5 minutes) or 2× (1 hour). Choose 1 hour if requests are often more than 5 minutes apart."
    zh-HK: "快取寫入之後留幾耐，每次命中重新計時。命中嘅輸入大約一折收費；寫入 5 分鐘嘅按 1.25 倍、1 個鐘嘅按 2 倍收費。兩次請求通常隔 5 分鐘以上，揀 1 個鐘抵啲。"
    zh-TW: "快取寫入後保留多久，每次命中重新計時。命中的輸入約按一折計費；寫入 5 分鐘的按 1.25 倍、1 小時的按 2 倍計費。兩次請求常隔 5 分鐘以上時選 1 小時更省。"
    de: "Wie lange ein Cache-Eintrag erhalten bleibt; jeder Treffer startet die Zeit neu. Gecachte Eingaben kosten etwa ein Zehntel, Schreiben 1,25× (5 Minuten) oder 2× (1 Stunde). Wähle 1 Stunde, wenn zwischen Anfragen oft mehr als 5 Minuten liegen."
    el: "Πόσο διατηρείται μια εγγραφή στην προσωρινή μνήμη· κάθε επιτυχία μηδενίζει τον χρόνο. Η αποθηκευμένη είσοδος κοστίζει περίπου το ένα δέκατο· η εγγραφή 1,25× (5 λεπτά) ή 2× (1 ώρα). Επιλέξτε 1 ώρα αν τα αιτήματα απέχουν συχνά πάνω από 5 λεπτά."
    ja: "キャッシュを書き込んでから保持する時間です。ヒットするたびに延長されます。ヒットした入力は約 1/10 の料金、書き込みは 1.25 倍（5 分）または 2 倍（1 時間）です。リクエストの間隔がよく 5 分を超えるなら 1 時間が得です。"
    es: "Cuánto se conserva una escritura en caché; cada acierto reinicia el tiempo. La entrada en caché cuesta una décima parte; escribir cuesta 1,25× (5 minutos) o 2× (1 hora). Elige 1 hora si las peticiones suelen separarse más de 5 minutos."
    fr: "Durée de conservation d’une écriture en cache ; chaque succès relance le délai. L’entrée en cache coûte environ un dixième ; l’écriture 1,25× (5 minutes) ou 2× (1 heure). Choisissez 1 heure si les requêtes sont souvent espacées de plus de 5 minutes."
    pt: "Quanto tempo uma gravação em cache é mantida; cada acerto reinicia o tempo. A entrada em cache custa cerca de um décimo; gravar custa 1,25× (5 minutos) ou 2× (1 hora). Escolha 1 hora se os pedidos costumam ter mais de 5 minutos de intervalo."
