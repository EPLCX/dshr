    en: Global instructions apply to every workspace; for one project, put an AGENTS.md in the workspace root. Each skill is a subfolder of the Skills folder with a SKILL.md inside.
    zh-HK: "全域指示適用於所有工作區；如果只係某個專案嘅，就喺工作區根目錄放個 AGENTS.md。每個 Skill 都係 Skills 資料夾入面嘅一個子資料夾，入面有 SKILL.md。"
    zh-TW: "全域指示適用於所有工作區；若要針對單一專案，請在工作區根目錄放置 AGENTS.md。每個 Skill 都是 Skills 資料夾下的一個子資料夾，內含 SKILL.md。"
    de: "Globale Anweisungen gelten für alle Arbeitsbereiche; für ein einzelnes Projekt lege eine AGENTS.md im Stammordner des Arbeitsbereichs ab. Jeder Skill ist ein Unterordner des Skills-Ordners mit einer SKILL.md darin."
    el: "Οι καθολικές οδηγίες ισχύουν για κάθε χώρο εργασίας· για ένα έργο, τοποθετήστε ένα AGENTS.md στη ρίζα του χώρου εργασίας. Κάθε skill είναι υποφάκελος του φακέλου Skills με ένα SKILL.md μέσα."
    ja: "グローバルな指示はすべてのワークスペースに適用されます。特定のプロジェクトには、ワークスペースのルートに AGENTS.md を置いてください。各スキルは Skills フォルダ内のサブフォルダで、中に SKILL.md を含みます。"
    es: "Las instrucciones globales se aplican a todos los espacios de trabajo; para un solo proyecto, pon un AGENTS.md en la raíz del espacio de trabajo. Cada skill es una subcarpeta de la carpeta Skills con un SKILL.md dentro."
    fr: "Les instructions globales s’appliquent à tous les espaces de travail ; pour un projet, placez un AGENTS.md à la racine de l’espace de travail. Chaque skill est un sous-dossier du dossier Skills contenant un SKILL.md."
    pt: "As instruções globais valem para todos os espaços de trabalho; para um projeto específico, coloque um AGENTS.md na raiz do espaço de trabalho. Cada skill é uma subpasta da pasta de Skills com um SKILL.md dentro."
