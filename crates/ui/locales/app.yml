  forked:
    zh-CN: "此会话分叉自原会话第 %{turn} 轮之后"
    en: This session was forked after turn %{turn} of another session
    zh-HK: "這個對話係喺另一個對話第 %{turn} 個回合開出嚟嘅"
    zh-TW: "此工作階段是從另一個工作階段的第 %{turn} 回合分支而來"
    de: "Diese Sitzung wurde nach Schritt %{turn} einer anderen Sitzung verzweigt"
