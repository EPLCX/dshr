    en: "Low risk"
    zh-HK: "低風險"
    zh-TW: "低風險"
    de: "Geringes Risiko"
    el: "Χαμηλός κίνδυνος"
    ja: "低リスク"
    es: "Riesgo bajo"
    fr: "Risque faible"
    pt: "Risco baixo"
  risk_low_detail:
    zh-CN: "没有声明需要留意的权限，也不会在沙箱外运行程序。"
    en: "It asks for no sensitive permissions and runs nothing outside the sandbox."
    zh-HK: "冇聲明咩要留意嘅權限，亦唔會喺沙盒以外執行程式。"
    zh-TW: "沒有宣告需要留意的權限，也不會在沙盒外執行程式。"
    de: "Es fordert keine sensiblen Berechtigungen an und führt nichts außerhalb der Sandbox aus."
    el: "Δεν ζητά ευαίσθητα δικαιώματα και δεν εκτελεί τίποτα εκτός του sandbox."
    ja: "注意が必要な権限は要求せず、サンドボックスの外で何も実行しません。"
    es: "No pide permisos delicados ni ejecuta nada fuera del sandbox."
    fr: "Il ne demande aucune autorisation sensible et n’exécute rien hors du bac à sable."
    pt: "Não pede permissões sensíveis nem executa nada fora da sandbox."
  risk_medium:
    zh-CN: "需要留意"
    en: "Review carefully"
    zh-HK: "要留意"
    zh-TW: "需要留意"
    de: "Sorgfältig prüfen"
    el: "Ελέγξτε προσεκτικά"
    ja: "要確認"
    es: "Revisa con atención"
    fr: "À examiner"
    pt: "Revise com atenção"
  risk_medium_detail:
    zh-CN: "它要的权限能改动你的文件或替你操作，或者带脚本却没有签名。确认来源可信再安装。"
    en: "It asks for permissions that can change your files or act for you, or it runs a script without a signature. Install only if you trust the source."
    zh-HK: "外掛要嘅權限可以用嚟改你嘅檔案或者代你操作，又或者外掛有腳本但未簽名。確認來源信得過先好裝。"
    zh-TW: "它要求的權限能變更你的檔案或代你操作，或者帶有腳本卻沒有簽章。確認來源可信再安裝。"
    de: "Es fordert Berechtigungen an, mit denen es deine Dateien ändern oder in deinem Namen handeln kann, oder es enthält ein unsigniertes Skript. Installiere es nur, wenn du der Quelle vertraust."
    el: "Ζητά δικαιώματα που μπορούν να αλλάξουν τα αρχεία σας ή να ενεργούν για λογαριασμό σας, ή περιέχει σενάριο χωρίς υπογραφή. Εγκαταστήστε το μόνο αν εμπιστεύεστε την πηγή."
    ja: "ファイルの変更やあなたに代わる操作ができる権限を要求しているか、署名のないスクリプトを含んでいます。入手元を信頼できる場合のみインストールしてください。"
    es: "Pide permisos que pueden cambiar tus archivos o actuar en tu nombre, o incluye un script sin firma. Instálalo solo si confías en el origen."
    fr: "Il demande des autorisations qui peuvent modifier vos fichiers ou agir pour vous, ou il contient un script non signé. N’installez-le que si vous faites confiance à la source."
    pt: "Pede permissões que podem alterar seus arquivos ou agir por você, ou inclui um script sem assinatura. Instale apenas se confiar na origem."
  risk_high:
    zh-CN: "高风险"
    en: "High risk"
    zh-HK: "高風險"
    zh-TW: "高風險"
    de: "Hohes Risiko"
    el: "Υψηλός κίνδυνος"
    ja: "高リスク"
    es: "Riesgo alto"
    fr: "Risque élevé"
    pt: "Risco alto"
  risk_high_detail:
    zh-CN: "它能运行程序、任意联网、在沙箱外启动 MCP 服务器，或者发布者已经变了。只安装你完全信任的插件。"
    en: "It can run programs, reach any host, start MCP servers outside the sandbox, or its publisher has changed. Install only plugins you fully trust."
    zh-HK: "外掛可以執行程式、連任何網站或者喺沙盒以外開 MCP 伺服器，又或者佢個發佈者已經變咗。淨係裝你完全信得過嘅外掛。"
    zh-TW: "它能執行程式、連線到任何網站、在沙盒外啟動 MCP 伺服器，或者發佈者已經變更。只安裝你完全信任的外掛。"
    de: "Es kann Programme ausführen, beliebige Hosts erreichen, MCP-Server außerhalb der Sandbox starten, oder sein Herausgeber hat sich geändert. Installiere nur Plugins, denen du voll vertraust."
    el: "Μπορεί να εκτελεί προγράμματα, να συνδέεται σε οποιονδήποτε διακομιστή, να ξεκινά διακομιστές MCP εκτός του sandbox, ή ο εκδότης του έχει αλλάξει. Εγκαταστήστε μόνο plugin που εμπιστεύεστε πλήρως."
    ja: "プログラムの実行、任意のホストへの接続、サンドボックス外での MCP サーバーの起動ができるか、発行元が変わっています。完全に信頼できるプラグインだけをインストールしてください。"
    es: "Puede ejecutar programas, conectarse a cualquier sitio, iniciar servidores MCP fuera del sandbox, o su editor ha cambiado. Instala solo plugins en los que confíes plenamente."
    fr: "Il peut exécuter des programmes, joindre n’importe quel hôte, démarrer des serveurs MCP hors du bac à sable, ou son éditeur a changé. N’installez que des plugins en qui vous avez entièrement confiance."
    pt: "Pode executar programas, acessar qualquer site, iniciar servidores MCP fora da sandbox, ou o editor mudou. Instale apenas plugins em que você confia totalmente."
