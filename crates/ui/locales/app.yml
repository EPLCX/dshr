    zh-CN: "使用对比更强的配色，让文字和控件更容易看清，或跟随您的系统设置。开启时不能另选配色方案。"
    en: "Use stronger colours so text and controls are easier to see, or follow your system setting. While it is on, the colour scheme cannot be changed."
    zh-HK: "用對比強啲嘅配色，令文字同控制項易睇啲，或者跟你嘅系統設定。開咗嗰陣唔可以另揀配色。"
    zh-TW: "使用對比更強的配色，讓文字和控制項更容易看清，或跟隨您的系統設定。開啟時無法另選配色方案。"
    de: "Kräftigere Farben, damit Text und Steuerelemente besser zu sehen sind, oder der Systemeinstellung folgen. Solange aktiv, lässt sich das Farbschema nicht ändern."
    el: "Πιο έντονα χρώματα για να φαίνονται καλύτερα κείμενο και στοιχεία ελέγχου, ή ακολούθηση της ρύθμισης του συστήματος. Όσο είναι ενεργό, ο συνδυασμός χρωμάτων δεν αλλάζει."
    ja: "文字やコントロールが見やすい、コントラストの強い配色を使うか、システムの設定に従います。オンの間は配色を変更できません。"
    es: "Usa colores más intensos para ver mejor el texto y los controles, o sigue la configuración del sistema. Mientras esté activado, no se puede cambiar el esquema de colores."
    fr: "Utilise des couleurs plus contrastées pour mieux voir le texte et les contrôles, ou suit le réglage du système. Tant qu’il est actif, le jeu de couleurs ne peut pas être modifié."
    pt: "Usa cores mais fortes para facilitar a leitura de textos e controles, ou segue a configuração do sistema. Enquanto estiver ativo, o esquema de cores não pode ser alterado."
  palette_locked:
    zh-CN: "已开启高对比度，配色由它决定。在“辅助功能”里关闭高对比度后才能另选。"
    en: "High contrast is on and sets the colours. Turn it off in Accessibility to choose another scheme."
    zh-HK: "已經開咗高對比，配色由佢決定。喺「輔助功能」熄咗高對比先可以另揀。"
    zh-TW: "已開啟高對比，配色由它決定。在「協助工具」關閉高對比後才能另選。"
    de: "Hoher Kontrast ist aktiv und bestimmt die Farben. Unter Barrierefreiheit ausschalten, um ein anderes Schema zu wählen."
    el: "Η υψηλή αντίθεση είναι ενεργή και ορίζει τα χρώματα. Απενεργοποιήστε τη στην Προσβασιμότητα για άλλο συνδυασμό."
    ja: "ハイコントラストがオンのため、配色はそれに従います。別の配色を選ぶには「アクセシビリティ」でオフにしてください。"
    es: "El alto contraste está activado y define los colores. Desactívalo en Accesibilidad para elegir otro esquema."
    fr: "Le contraste élevé est activé et définit les couleurs. Désactivez-le dans Accessibilité pour choisir un autre jeu."
