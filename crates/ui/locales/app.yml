    zh-CN: "关闭后将不再提供相应功能，重启后生效（JS 插件的开关立即生效）。插件的配置项列在其下方，留空表示使用默认值。"
    en: Turning one off removes that feature after a restart (JS plugin switches apply immediately). A plugin's own options are listed under it; leave one empty to use the default.
    zh-HK: "關咗某項功能就會移除佢。外掛嘅個別選項會列喺佢下面；唔填就用預設值。"
    zh-TW: "關閉某項功能即會移除該功能。外掛程式自身的選項會列於其下；留空即使用預設值。"
    de: "Ein Plugin auszuschalten entfernt diese Funktion. Die eigenen Optionen eines Plugins stehen darunter; lass ein Feld leer, um den Standard zu verwenden."
