  steer_tooltip:
    zh-CN: "插队（%{key}+Enter）：当前步骤完成后立即交给模型，不等本轮结束"
    en: "Send now (%{key}+Enter): the model gets it as soon as the current step finishes, without waiting for the turn to end"
    zh-HK: "插隊（%{key}+Enter）：而家這步搞掂就即刻交畀模型，唔使等成輪完"
    zh-TW: "插隊（%{key}+Enter）：目前步驟完成後立即交給模型，不等本輪結束"
    de: "Jetzt senden (%{key}+Enter): Das Modell erhält die Nachricht nach dem aktuellen Schritt, ohne auf das Ende der Runde zu warten"
    el: "Αποστολή τώρα (%{key}+Enter): το μοντέλο το λαμβάνει μόλις τελειώσει το τρέχον βήμα, χωρίς να περιμένει το τέλος του γύρου"
    ja: "割り込み送信（%{key}+Enter）：ターンの終了を待たず、現在のステップが終わり次第モデルに渡します"
    es: "Enviar ahora (%{key}+Enter): el modelo lo recibe en cuanto termina el paso actual, sin esperar al final del turno"
    fr: "Envoyer maintenant (%{key}+Entrée) : le modèle le reçoit dès la fin de l’étape en cours, sans attendre la fin du tour"
    pt: "Enviar agora (%{key}+Enter): o modelo recebe assim que a etapa atual terminar, sem esperar o fim do turno"
