    zh-HK: "內置功能、JS 外掛、MCP 伺服器同專案指示。啲掣同選項要重新開返先會生效；JS 外掛檔案你一儲存就即刻重新載入。"
    zh-TW: "內建功能、JS 外掛程式、MCP 伺服器與專案指示。開關與選項需重新啟動後才會生效；JS 外掛程式檔案在您儲存後會立即重新載入。"
    de: "Integrierte Funktionen, JS-Plugins, MCP-Server und Projektanweisungen. Schalter und Optionen wirken nach einem Neustart; JS-Plugin-Dateien werden sofort beim Speichern neu geladen."
    el: "Ενσωματωμένες λειτουργίες, plugin JS, διακομιστές MCP και οδηγίες έργου. Οι διακόπτες και οι επιλογές ισχύουν μετά από επανεκκίνηση· τα αρχεία plugin JS φορτώνονται ξανά αμέσως μόλις τα αποθηκεύσετε."
    ja: "内蔵機能、JSプラグイン、MCPサーバー、プロジェクトの指示。スイッチやオプションは再起動後に反映されます。JSプラグインのファイルは保存するとすぐに再読み込みされます。"
    es: "Funciones integradas, plugins JS, servidores MCP e instrucciones del proyecto. Los interruptores y opciones se aplican tras reiniciar; los archivos de plugins JS se recargan al guardarlos."
    fr: "Fonctionnalités intégrées, plugins JS, serveurs MCP et instructions de projet. Les interrupteurs et options prennent effet après un redémarrage ; les fichiers de plugins JS se rechargent dès que vous les enregistrez."
    pt: "Recursos integrados, plugins JS, servidores MCP e instruções do projeto. As opções e chaves entram em vigor após reiniciar; os arquivos de plugin JS são recarregados assim que você os salva."
