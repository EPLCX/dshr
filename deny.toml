# cargo-deny：依赖的许可证、安全公告、来源。CI 里跑 `cargo deny check`。
# 许可证名单按当前依赖树（Cargo.lock）里实际出现的整理；新依赖带来名单外的许可证时 CI 会报出来，确认后再加。

[graph]
all-features = true

[advisories]
# RustSec 公告：有漏洞（vulnerability）的依赖直接报错；不再维护、被撤回的版本也报出来。
version = 2
yanked = "deny"
ignore = [
    # chrono 不再维护、没有可升级的版本；它经 GPUI（gpui-pre、gpui-base、gpui-component）进来，换不掉。
    # 没有漏洞公告，等 GPUI 换成 jiff / time 后再去掉这一条。
    { id = "RUSTSEC-2026-0543", reason = "chrono 经 GPUI 引入，无可替代版本；仅为不再维护，无已知漏洞" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    # webpki-roots / webpki-root-certs：Mozilla 根证书列表。
    "CDLA-Permissive-2.0",
    # 文件级的弱 copyleft：cbindgen（构建工具）、dwrote（Windows 字体）、option-ext。不改它们的源码就没有额外义务；
    # 分发程序时须告知其源码的获取方式（MPL-2.0 第 3.2 条），THIRD_PARTY_NOTICES.md 的依赖清单已链接到各自的源码仓库。
    "MPL-2.0",
]

[bans]
# 同一个 crate 的多个版本只提示（GPUI 生态里很常见），不报错。
multiple-versions = "warn"
wildcards = "deny"
# 工作区内部的 path 依赖不算通配。
allow-wildcard-paths = true

[sources]
# 只从 crates.io 取依赖；vendor/ 里打过补丁的 GPUI Windows 后端是 path 依赖，不受影响。
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
